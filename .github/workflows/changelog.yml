name: changelog

# Fails a pull request that changes shipped code (src, viewer, the build and
# install scripts, package.json, tsconfig.json or rust/gg-docs) without adding
# a CHANGELOG.md line. Waive it with the skip-changelog label; Dependabot's pull requests skip
# it. An upstream sync passes on the upstream sections it brings in, or takes
# the label when it brings none.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  changelog:
    name: changelog line
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check for a changelog line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          shipped='^(src|viewer)/|^scripts/(postinstall|build-viewer|vendor-grammars|stamp-commit|stamp-telemetry-key)\.mjs$|^package\.json$|^tsconfig\.json$|^rust/gg-docs/(src/|Cargo\.toml$)'
          changed=$(git diff --no-renames --name-only "$BASE...$HEAD")
          if ! grep -qE "$shipped" <<< "$changed"; then
            echo "No shipped file changed."
            exit 0
          fi
          log=$(git diff -U0 "$BASE...$HEAD" -- CHANGELOG.md)
          if awk '/^\+/ && !/^\+\+\+ / && substr($0, 2) ~ /[^[:space:]]/ { found = 1 } END { exit !found }' <<< "$log"; then
            echo "CHANGELOG.md has a new line."
            exit 0
          fi
          echo "::error file=CHANGELOG.md::This pull request changes shipped code but adds no CHANGELOG.md line. Add one under the top, unreleased section, or apply the skip-changelog label if users will not notice the change."
          exit 1
