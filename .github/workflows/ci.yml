name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A pull request that changes only the documents named below skips the work in
  # every job here; no test, build or check in this workflow reads them (checked
  # 15 November 2026: recheck before adding a path). The matrix jobs still start
  # and pass with their steps skipped, as the ruleset requires the test jobs by name
  # and a matrix job skipped whole would report under its unexpanded name. The
  # others are skipped, which counts as passed. If this job fails, everything runs.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Find whether only documents changed
        id: diff
        if: github.event_name == 'pull_request'
        # HEAD is the merge commit the tests run on, and its first parent is the
        # base. Without --no-renames a file moved into docs/ would hide its source.
        run: |
          files=$(git diff --name-only --no-renames HEAD^1 HEAD)
          if grep -qvE '^((README|CHANGELOG|CONTRIBUTING|SECURITY|CREDITS|TELEMETRY)\.md|benchmark/README\.md|docs/.+)$' <<< "$files"; then
            echo docs_only=false >> "$GITHUB_OUTPUT"
          else
            echo docs_only=true >> "$GITHUB_OUTPUT"
          fi

  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }}${{ matrix.os == 'windows-latest' && format(', part {0} of 2', matrix.part) || '' }})
    needs: [changes]
    if: ${{ !cancelled() }}
    timeout-minutes: 60
    # The tool stores repo-relative paths and parses them with '/', so a separator
    # leak on Windows matches nothing instead of failing. Windows stays a gate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # A released major, not "current": setup-node resolves that to the first entry of
        # Node's index, which can be a pre-release (v27.0.0-alpha from 29 October 2026).
        node: ["20", "26"]
        # Windows splits the suite across 2 jobs (scripts/run-tests.mjs, TEST_PART):
        # whole, its test step took about 11.5 minutes and set every pull request's wait.
        part: [1, 2]
        # Windows on Node 20 was the slowest leg and set every pull request's wait.
        # Pull requests test Node 20 on ubuntu and Windows on Node 26; pushes
        # to main and manual runs still test Windows on Node 20.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'windows-latest' || 'none' }}
            node: "20"
          - os: ubuntu-latest
            part: 2
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Runs the package's prepare script, which is `npm run build`. The grammars
      # are native addons, and the node-gyp devDependency chooses their toolchain,
      # so keep it at 12.x whilst this matrix holds Node 20. The script retries a
      # failed install, as node-gyp's download of Node's headers can be cut off.
      - name: Install and build
        if: needs.changes.outputs.docs_only != 'true'
        shell: bash
        run: bash scripts/ci-install.sh
      - name: Type check
        if: needs.changes.outputs.docs_only != 'true' && matrix.part == 1
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
          node node_modules/typescript/bin/tsc --noEmit -p viewer/tsconfig.json
      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        env:
          TEST_PART: ${{ matrix.os == 'windows-latest' && format('{0}/2', matrix.part) || '' }}
        run: npm test ${{ matrix.os == 'ubuntu-latest' && matrix.node == '26' && '-- --coverage' || '' }}
      - name: Keep the coverage reports for the Codecov upload
        if: needs.changes.outputs.docs_only != 'true' && matrix.os == 'ubuntu-latest' && matrix.node == '26'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-*.lcov
          retention-days: 1
      - name: Test the benchmark's TypeScript truth
        if: needs.changes.outputs.docs_only != 'true' && matrix.part == 1
        run: node --test benchmark/test/tsc-truth.test.mjs

  # The ruleset requires `test (windows-latest, Node 26)`, which the 2 Windows parts
  # replace. This job reports it, and passes only when every test job passed.
  windows-tests:
    name: test (windows-latest, Node 26)
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success

  # rust/gg-docs, the binary behind `trail docs`: its own checks, then the docs
  # tests through both CLI entry points on the release build, which they find
  # in target/release. GG_DOCS_E2E=require turns their skip into a failure.
  gg-docs:
    name: gg-docs (${{ matrix.os }})
    needs: [changes]
    if: ${{ !cancelled() }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust/gg-docs/rust-toolchain.toml.
      - name: Install the toolchain
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: rust/gg-docs
        run: rustup toolchain install
      # The crate's 353 locked packages compiled from cold on every run. Only main
      # saves; pull requests restore main's entries without writing their own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.docs_only != 'true'
        with:
          workspaces: rust/gg-docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the crate
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: rust/gg-docs
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: "20"
          package-manager-cache: false
      # Install scripts stay on, as in the test job: esbuild and the tree-sitter
      # grammars need theirs, and the package's prepare script is the build.
      - name: Install and build
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/ci-install.sh
      - name: Run the docs commands on the release build
        if: needs.changes.outputs.docs_only != 'true'
        env:
          GG_DOCS_E2E: require
        run: node --import tsx --test test/docs-cli.test.ts

  # rust/gg-bench, the caller benchmark's runner and scorer. Its tests start Node
  # and git on a local fixture; nothing reaches the network.
  gg-bench:
    name: gg-bench (${{ matrix.os }})
    needs: [changes]
    if: ${{ !cancelled() }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.docs_only != 'true'
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust/gg-bench/rust-toolchain.toml.
      - name: Install the toolchain
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: rust/gg-bench
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.docs_only != 'true'
        with:
          workspaces: rust/gg-bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: "20"
          package-manager-cache: false
      - name: Check the crate
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: rust/gg-bench
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs.
  codecov:
    name: upload coverage to Codecov
    needs: [changes, test]
    if: needs.changes.outputs.docs_only != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage must not turn the tests badge red.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-main.lcov,coverage-alone.lcov
          disable_search: true
          fail_ci_if_error: true

  node24-wasm:
    name: Node 24 WASM regression
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: bash scripts/ci-install.sh
      - name: Exercise every breadth grammar
        run: node --import tsx --test test/generic-node24.test.ts
