name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 60
    # The tool stores repo-relative paths and parses them with '/', so a separator
    # leak on Windows matches nothing instead of failing. Windows stays a gate.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "current"]
        # Windows on Node 20 was the slowest leg and set every pull request's wait.
        # Pull requests test Node 20 on ubuntu and Windows on Node current; pushes
        # to main and manual runs still test Windows on Node 20.
        exclude:
          - os: ${{ github.event_name == 'pull_request' && 'windows-latest' || 'none' }}
            node: "20"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # Runs the package's prepare script, which is `npm run build`. The grammars
      # are native addons, and the node-gyp devDependency chooses their toolchain,
      # so keep it at 12.x whilst this matrix holds Node 20.
      - name: Install and build
        run: npm ci # NOSONAR: locked dependencies need native grammar and prepare lifecycle scripts.
      - name: Type check
        run: |
          node node_modules/typescript/bin/tsc --noEmit -p tsconfig.json
          node node_modules/typescript/bin/tsc --noEmit -p viewer/tsconfig.json
      - name: Test
        run: npm test ${{ matrix.os == 'ubuntu-latest' && matrix.node == 'current' && '-- --coverage' || '' }}
      - name: Keep the coverage reports for the Codecov upload
        if: matrix.os == 'ubuntu-latest' && matrix.node == 'current'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-codecov
          path: coverage-*.lcov
          retention-days: 1
      - name: Test the benchmark scorer
        run: node --test benchmark/test/score.test.mjs

  # rust/gg-docs, the binary behind `trail docs`: its own checks, then the docs
  # tests through both CLI entry points on the release build, which they find
  # in target/release. GG_DOCS_E2E=require turns their skip into a failure.
  gg-docs:
    name: gg-docs (${{ matrix.os }})
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust/gg-docs/rust-toolchain.toml.
      - name: Install the toolchain
        working-directory: rust/gg-docs
        run: rustup toolchain install
      # The crate's 353 locked packages compiled from cold on every run. Only main
      # saves; pull requests restore main's entries without writing their own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/gg-docs
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the crate
        working-directory: rust/gg-docs
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
      # Install scripts stay on, as in the test job: esbuild and the tree-sitter
      # grammars need theirs, and the package's prepare script is the build.
      - name: Install and build
        run: npm ci # NOSONAR: see above
      - name: Run the docs commands on the release build
        env:
          GG_DOCS_E2E: require
        run: node --import tsx --test test/docs-cli.test.ts

  # The upload runs apart from the tests so the OIDC token is never available
  # while test code runs.
  codecov:
    name: upload coverage to Codecov
    needs: [test]
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A Codecov outage must not turn the tests badge red.
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # Authenticate the Codecov upload with OIDC; no stored token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-codecov
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-main.lcov,coverage-alone.lcov
          disable_search: true
          fail_ci_if_error: true

  node24-wasm:
    name: Node 24 WASM regression
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci # NOSONAR: locked dependencies need native grammar and prepare lifecycle scripts.
      - name: Exercise every breadth grammar
        run: node --import tsx --test test/generic-node24.test.ts
