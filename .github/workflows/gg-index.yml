name: gg-index

# rust/gg-index, the staged native Rust indexing engine. Its own workflow until it
# joins ci.yml; nothing outside rust/gg-index and the TypeScript it matches can
# change its result.
on:
  push:
    branches: [main]
    paths: ["rust/gg-index/**", "src/graph/write.ts", "src/util/safe-fs.ts", "src/graph/source-files.ts", "src/graph/extract.ts", "src/graph/generic.ts", "src/graph/container.ts", "src/graph/deploy.ts", ".gitattributes", ".github/workflows/gg-index.yml"]
  pull_request:
    paths: ["rust/gg-index/**", "src/graph/write.ts", "src/util/safe-fs.ts", "src/graph/source-files.ts", "src/graph/extract.ts", "src/graph/generic.ts", "src/graph/container.ts", "src/graph/deploy.ts", ".gitattributes", ".github/workflows/gg-index.yml"]
  workflow_dispatch:

concurrency:
  group: gg-index-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gg-index:
    name: gg-index (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup installs the toolchain pinned in rust/gg-index/rust-toolchain.toml.
      - name: Install the toolchain
        working-directory: rust/gg-index
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust/gg-index
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the crate
        working-directory: rust/gg-index
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo build --locked --release
      # Node 26 carries ICU 78, the collation the Rust sort is checked against. Root
      # collation does not vary by platform, so the comparison runs on Ubuntu only.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.os == 'ubuntu-latest'
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Compare with the TypeScript writer
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx tsx rust/gg-index/parity/wiring-parity.ts --bin rust/gg-index/target/release/gg-index --count 1000 --seed "$GITHUB_RUN_ID"
      # Stage 3B1a: extension list and per-name classification; 3B1b: source trees
      # (sources). Sources parity compares Linux source discovery on ubuntu-latest
      # only; windows-latest runs the crate checks and Windows unit tests, while
      # Windows parity and reparse-point/PATH gaps are deferred to the Windows pass.
      # Cache and fingerprint join with --kinds as they are ported.
      - name: Compare discovery with the TypeScript
        if: matrix.os == 'ubuntu-latest'
        run: npx tsx rust/gg-index/parity/discovery-parity.ts --bin rust/gg-index/target/release/gg-index --kinds sources --seed "$GITHUB_RUN_ID"
