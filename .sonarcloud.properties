# benchmark/ is a developer tool: package.json "files" leaves it out, the build never
# runs it, and its arguments come from whoever runs it, so the taint findings about
# command-line arguments there do not apply.
sonar.exclusions=benchmark/**

# Files kept byte for byte as in upstream Trail-Code, so a sync does not conflict on them.
# Each criterion below keeps one reviewed rule out of one such file; the findings are:
#   S2245: random names that tell a lock or temporary file apart; they are not secrets.
#   S2871: sorts of strings only, where the default code-unit order is deterministic.
#   S5443: a temporary-folder path compared against to spot scratch paths, never written.
#   S5850: regex anchors that apply to one alternative on purpose.
#   S5852: keep-answer.ts collapses whitespace and caps input at 200 characters first.
#   S6324: regexes that match VT and FF line breaks on purpose.
#   S7727: a callback that takes one argument, so forEach's extra arguments are ignored.
#   S7739: a 'then' property that holds a Cmd object, not a function.
# A criterion goes when its file changes here or its rule is fixed upstream.
sonar.issue.ignore.multicriteria=u1,u2,u3,u4,u5,u6,u7,u8,u9,u10,u11,u12,u13,u14,u15,u16,u17,u18,u19,u20,u21,u22,u23,u24,u25,u26,u27,u28
