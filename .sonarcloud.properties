# benchmark/ is a developer tool: package.json "files" leaves it out, the build never
# runs it, and its arguments come from whoever runs it, so the taint findings about
# command-line arguments there do not apply.
#
# The src/ files listed after it are kept byte for byte as in upstream Trail-Code, so a
# sync does not conflict on them. Each one's findings were reviewed as not applying
# (sorts of strings only, deliberate regex anchors and VT or FF line breaks, random names
# that are not secrets, a 'then' property that is not a function, a callback taking one
# argument, input capped before a regex). Automatic analysis reads no per-rule criteria
# from this file, so the whole file is left out; CodeQL still scans it. Take a file off
# this list when the fork changes it.
sonar.exclusions=benchmark/**,\
  src/check/local-check.ts,\
  src/context/batches.ts,\
  src/graph/map.ts,\
  src/init/candidates.ts,\
  src/init/keep-answer.ts,\
  src/init/miners.ts,\
  src/init/review-screen.ts,\
  src/learn/sessions.ts,\
  src/notes/flatten.ts,\
  src/notes/learning-fields.ts,\
  src/notes/secrets.ts,\
  src/skills/anchors-cli.ts,\
  src/skills/cli-skills.ts,\
  src/skills/compile-words.ts,\
  src/skills/learning-steps.ts,\
  src/skills/lessons.ts,\
  src/skills/skillmd.ts,\
  src/skills/skills.ts,\
  src/skills/store.ts,\
  src/skills/validate.ts,\
  src/telemetry/contract.ts,\
  src/telemetry/sessions.ts,\
  src/trace/gate-file.ts,\
  src/trace/pool.ts,\
  src/trace/run-calls.ts,\
  src/trace/wall-state.ts,\
  src/trace/walls.ts,\
  src/util/private-fs.ts
