# Codecov gates merges: every changed coverable line must be covered (patch 100%)
# and the project figure must not fall below the base. The tests workflow sends
# the TypeScript and Rust reports in one upload, so each status is scored on the
# whole report. The rust component gives the Rust crates' own figure. Codecov
# posts no comments.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false
component_management:
  individual_components:
    - component_id: rust
      name: rust
      paths:
        - rust/**
comment: false
