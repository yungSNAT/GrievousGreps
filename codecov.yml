# Codecov gates merges: every changed coverable line must be covered (patch 100%)
# and the project figure must not fall below the base. Both statuses wait for the
# 2 uploads of the tests workflow, TypeScript and the Rust crates (flag rust), so
# neither is posted on half a report. Codecov posts no comments.
codecov:
  notify:
    after_n_builds: 2
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false
comment: false
