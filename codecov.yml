# Codecov gates merges: every changed coverable line must be covered (patch 100%)
# and the project figure must not fall below the base. The tests workflow sends
# both TypeScript reports in one upload, so each status is scored on the whole
# report. Codecov posts no comments.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0%
        informational: false
    patch:
      default:
        target: 100%
        threshold: 0%
        informational: false
comment: false
