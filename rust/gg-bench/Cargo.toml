[package]
name = "gg-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "The caller benchmark for GrievousGreps: recall of `callers` on pinned public repositories"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# preserve_order keeps each truth file's symbols in file order, which the verbose lines follow.
serde_json = { version = "1.0", features = ["preserve_order"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints.clippy]
too_many_lines = "warn"
