[package]
name = "gg-index"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Native Rust indexing engine for GrievousGreps (staged port of src/graph)"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
icu_collator = "2.4"
ryu-js = "1.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[lints.clippy]
too_many_lines = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
