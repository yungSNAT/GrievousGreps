[package]
name = "gg-query"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false
description = "Native Rust query engine for GrievousGreps: indexed SQLite graph reads and F16 Model2Vec semantic search"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage"] }
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
unicode-general-category = "1.1"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
snapbox = { version = "1.2", default-features = false, features = ["cmd"] }
tempfile = "3"

[lints.clippy]
too_many_lines = "warn"

[profile.release]
lto = true
codegen-units = 1
strip = true
